[project]
name = "vexil"
version = "0.0.1"
description = "Weekly monitoring of live Dota 2 win-probability models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexil"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The four audited train.py files are frozen by hash; they are never reformatted or fixed.
extend-exclude = ["models/candidates/*/train.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# session scripts: closures inside loops and long evidence labels are accepted there
"scripts/*" = ["B023", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
