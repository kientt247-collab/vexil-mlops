# The weekly job: pull, score, evaluate, alarms, challengers, dashboard.
# It runs every Monday at 03:17 UTC and can always be started by hand.
# The schedule belongs to lock version 2 (2026-11-21); under version 1 it was
# taken out after an hour because of an upload defect (see docs/runbook.md).
name: weekly

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything, but upload, commit and publish nothing and open no issue"
        type: boolean
        default: false
      publish_only:
        description: "Only rebuild and publish the dashboard from the committed tables"
        type: boolean
        default: false

permissions:
  contents: write   # commit the weekly tables, upload weekly data files to the release
  issues: write     # open, comment on and close alarm issues
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-dev

      - name: Pull, score, evaluate, raise alarms
        if: ${{ !inputs.publish_only }}
        run: uv run --no-dev python -m vexil run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build the dashboard
        run: uv run --no-dev python -m vexil dashboard --out site

      - name: Commit the weekly tables
        if: ${{ !inputs.dry_run && !inputs.publish_only }}
        run: |
          git config user.name "vexil-weekly"
          git config user.email "actions@users.noreply.github.com"
          git add data/manifest.json monitoring state models
          git diff --cached --quiet || git commit -m "weekly run $(date -u +%Y-%m-%d)"
          git push

      - name: Show what changed (dry run)
        if: ${{ inputs.dry_run }}
        run: git status --short | head -40; cat monitoring/last_run.json

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: site

  pages:
    if: ${{ !inputs.dry_run }}
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
