# One-off for node M2: copy the seeded weekly files from the temporary branch
# `seed-data` into the release `data-2026`, then check every file against the manifest
# through the public download path. Removed after it has run.
name: seed-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: seed-data
          path: seed
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Upload the weekly files
        run: |
          notes="Weekly match files from OpenDota (https://www.opendota.com). See data/manifest.json."
          gh release view data-2026 >/dev/null 2>&1 || \
            gh release create data-2026 --title "data-2026" --notes "$notes"
          ls seed/*.jsonl.gz | wc -l
          gh release upload data-2026 seed/*.jsonl.gz --clobber
      - name: Check every week through the public download path
        run: uv run python -m vexil --store _fresh verify-remote
