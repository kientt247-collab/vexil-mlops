# Node M0 of the action map: prove each platform step once.
# The 15-minute schedule is temporary and is removed when M0 is done.
name: smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked

      - name: Call OpenDota and build the page
        run: uv run python -m vexil.smoke --out site

      - name: Store the record as a release asset and read it back
        run: |
          gh release view data-smoke >/dev/null 2>&1 || \
            gh release create data-smoke --title "data-smoke" --notes "M0 storage test"
          gh release upload data-smoke site/smoke.json --clobber
          mkdir -p _work/back
          gh release download data-smoke --pattern smoke.json --dir _work/back --clobber
          sha256sum site/smoke.json _work/back/smoke.json
          test "$(sha256sum < site/smoke.json)" = "$(sha256sum < _work/back/smoke.json)"

      - name: Open and close a test issue
        run: |
          url=$(gh issue create --title "M0 smoke: issue channel test" \
            --body "Opened by run ${{ github.run_id }} (${{ github.event_name }}). Closed by the same run.")
          echo "$url"
          gh issue close "$url" --comment "Closed by the smoke run."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
