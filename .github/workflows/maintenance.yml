# One-off, 2026-11-21 (lock version 2). Started by hand once, then removed.
# 1. Deletes two files that dry runs under lock version 1 uploaded to the release
#    under wrong names (copies of week 2026-11-09; nothing refers to them).
# 2. Rehearses the corrected upload: uploads the stored files of week 2026-11-16
#    again under their asset names and downloads them back against the manifest.
name: maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-dev

      - name: Delete the two stray files
        run: |
          for name in matches.jsonl.gz players.jsonl.gz; do
            gh release delete-asset data-2026 "$name" --yes || echo "not in the release: $name"
          done

      - name: Rehearse the upload of one week
        run: |
          uv run --no-dev python - <<'EOF'
          import shutil
          from pathlib import Path

          from vexil.data import remote
          from vexil.data.store import Store

          repository, week = "${{ github.repository }}", "2026-11-16"
          store = Store(Path("_store"), Path("data/manifest.json"))
          remote.download_week(store, week, repository)
          remote.upload_week(store, week, repository)
          shutil.rmtree("_store")
          remote.download_week(store, week, repository)  # checks both hashes
          print("uploaded under the asset names and read back:", week)
          EOF

      - name: List what the release holds now
        run: |
          gh release view data-2026 --json assets --jq '.assets | length'
          gh release view data-2026 --json assets --jq '.assets[].name' | grep -v '^week-' || echo "every asset is a weekly file"
