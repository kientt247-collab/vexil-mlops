# The registry: every model the pipeline scores, with its role.
#
# To put a model under monitoring, add an entry. To take it out, set its role to
# "retired". Nothing else has to change, as long as the model is of a kind the code
# already knows (see vexil/models/linear.py). The role "champion" needs the approval
# fields, because only a person may decide which model is in use.
#
# Roles: champion (the model in use), baseline, anchor (a fixed ruler for the weekly
# noise, never a product), challenger (scored next to the champion), retired.

models:
